name: Test basic bandit scan on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Python file to scan
        run: |
          mkdir -p /tmp/clean_code
          cat > /tmp/clean_code/hello.py << 'EOF'
          import os

          def greet(name):
              return "Hello, " + name

          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        with:
          targets: /tmp/clean_code
        continue-on-error: true

      - name: Assert bandit produced results.sarif
        run: |
          if [ ! -f results.sarif ]; then
            echo "FAIL: results.sarif was not produced"
            exit 1
          fi
          echo "PASS: results.sarif exists"
          cat results.sarif | head -20

      - name: Assert SARIF file is valid JSON
        run: |
          if ! python3 -c "import json, sys; json.load(open('results.sarif'))" 2>/dev/null; then
            echo "FAIL: results.sarif is not valid JSON"
            exit 1
          fi
          echo "PASS: results.sarif is valid JSON"

      - name: Assert action outcome (upload-sarif may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (upload-sarif fails on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
